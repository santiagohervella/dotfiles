---
# Runs the *arr stack with Docker Compose in OrbStack. Jellyfin stays native (see
# tasks/jellyfin.yml) so it keeps hardware transcoding, which containers on macOS can't use.
- name: Ensure arr_media_dir and arr_wireguard_private_key are set
  assert:
    that:
      - arr_media_dir | length > 0
      - arr_wireguard_private_key | length > 0
    fail_msg: Set arr_media_dir and arr_wireguard_private_key in config.yml when configure_arr is true

- name: Install OrbStack
  community.general.homebrew_cask:
    name: orbstack
    state: present

- name: Read OrbStack settings
  command: /opt/homebrew/bin/orb config show
  register: arr_orb_config
  changed_when: false

- name: Configure OrbStack to start at login with capped memory
  command: "/opt/homebrew/bin/orb config set {{ item.key }} {{ item.value }}"
  loop:
    - { key: app.start_at_login, value: "true" }
    - { key: memory_mib, value: "{{ arr_orbstack_memory_mib }}" }
  when: "(item.key ~ ': ' ~ item.value) not in arr_orb_config.stdout_lines"

- name: Start OrbStack
  command: /opt/homebrew/bin/orb start
  changed_when: false

- name: Create the compose directory
  file:
    path: "{{ arr_compose_dir }}"
    state: directory
    mode: "0700"

- name: Create download directories on the media drive
  file:
    path: "{{ arr_media_dir }}/downloads/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - movies
    - tv

- name: Install the compose file
  template:
    src: files/arr/compose.yml.j2
    dest: "{{ arr_compose_dir }}/compose.yml"
    mode: "0644"

- name: Install the compose secrets
  copy:
    content: "WIREGUARD_PRIVATE_KEY={{ arr_wireguard_private_key }}\n"
    dest: "{{ arr_compose_dir }}/.env"
    mode: "0600"

# The containers never update themselves, so each run of this tag is also how they get updated
- name: Pull the latest *arr images
  command: "{{ orbstack_bin }}/docker-compose pull --quiet"
  args:
    chdir: "{{ arr_compose_dir }}"
  changed_when: false

# (Re)creates containers whose config or image changed
- name: Start the *arr stack
  command: "{{ orbstack_bin }}/docker-compose up --detach --remove-orphans --wait"
  args:
    chdir: "{{ arr_compose_dir }}"
  register: arr_compose_up
  changed_when: arr_compose_up.stderr is search('Created|Recreated|Started|Removed')

- name: Remove images replaced by updates
  command: "{{ orbstack_bin }}/docker image prune --force"
  register: arr_image_prune
  changed_when: "'Total reclaimed space: 0B' not in arr_image_prune.stdout"

- name: Install the nightly config backup script
  template:
    src: files/arr/backup.sh.j2
    dest: "{{ arr_compose_dir }}/backup.sh"
    mode: "0755"

- name: Install the stuck request check
  template:
    src: files/arr/stuck-requests.py.j2
    dest: "{{ arr_compose_dir }}/stuck-requests.py"
    mode: "0700" # holds the Pushover keys
  when: arr_stuck_request_alerts

- name: Choose the scheduled jobs
  set_fact:
    arr_launch_agents: >-
      {{
        [{'label': arr_backup_launch_agent_label, 'program': arr_compose_dir ~ '/backup.sh',
          'hour': arr_backup_hour, 'log': 'arr-backup'}] +
        ([{'label': arr_stuck_request_launch_agent_label, 'program': arr_compose_dir ~ '/stuck-requests.py',
           'hour': arr_stuck_request_hour, 'log': 'arr-stuck-requests'}] if arr_stuck_request_alerts else [])
      }}

- name: Install the scheduled job LaunchAgents
  template:
    src: files/arr/launch-agent.plist.j2
    dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/{{ item.label }}.plist"
    mode: "0644"
  loop: "{{ arr_launch_agents }}"
  loop_control:
    label: "{{ item.label }}"
  register: arr_launch_agent_files

- name: Check which scheduled job LaunchAgents are loaded
  command: "launchctl print gui/{{ ansible_user_uid }}/{{ item.label }}"
  loop: "{{ arr_launch_agents }}"
  loop_control:
    label: "{{ item.label }}"
  register: arr_launch_agents_loaded
  changed_when: false
  failed_when: false

- name: Unload changed LaunchAgents so the changes take effect
  command: "launchctl bootout gui/{{ ansible_user_uid }}/{{ item.0.item.label }}"
  loop: "{{ arr_launch_agent_files.results | zip(arr_launch_agents_loaded.results) | list }}"
  loop_control:
    label: "{{ item.0.item.label }}"
  when: item.0.changed and item.1.rc == 0

- name: Load the scheduled job LaunchAgents
  command: "launchctl bootstrap gui/{{ ansible_user_uid }} {{ item.0.dest }}"
  loop: "{{ arr_launch_agent_files.results | zip(arr_launch_agents_loaded.results) | list }}"
  loop_control:
    label: "{{ item.0.item.label }}"
  when: item.0.changed or item.1.rc != 0

- name: Check Tailscale Funnel config
  command: "{{ tailscale_cli }} funnel status --json"
  register: arr_funnel_status
  changed_when: false
  when: arr_seerr_tailscale_funnel

- name: Expose Seerr to the internet with Tailscale Funnel
  command: "{{ tailscale_cli }} funnel --bg --https={{ arr_seerr_funnel_port }} {{ arr_seerr_port }}"
  when: >
    arr_seerr_tailscale_funnel and not (
      ':' ~ arr_seerr_funnel_port ~ '"' in arr_funnel_status.stdout and
      'http://127.0.0.1:' ~ arr_seerr_port in arr_funnel_status.stdout
    )
