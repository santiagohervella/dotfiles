# https://github.com/geerlingguy/ansible-collection-mac/blob/master/roles/mas/README.md
mas_installed_apps:
  - { id: 1558360383, name: 'Menu Bar Calendar (1.4.1)' }
  - { id: 6498891868, name: 'Persona Webcam (1.3.1)' }
  - { id: 497799835, name: 'Xcode (16.2)' }
  # - { id: 1596506190, name: "Play (2.4.0)" }
  # - { id: 1614730313, name: "MusicBox (1.4.7)" }
  # - { id: 1289583905, name: "Pixelmator Pro (3.6.14)" }
  # - { id: 6444667067, name: "Hyperduck (1.2.1)" }
  # - { id: 937984704, name: "Amphetamine (5.3.2)" }
  # - { id: 6449708232, name: "Linkeeper (2.0.1)" }

default_agent_personality: jarvis

# Jellyfin media server. Only the media server machine should enable this, via
# config.yml, along with jellyfin_storage_dir (e.g. a folder on the media drive)
configure_jellyfin: false
jellyfin_storage_dir: ''
jellyfin_app_path: "{{ homebrew_cask_appdir }}/Jellyfin.app"
jellyfin_launch_agent_label: org.jellyfin.server
jellyfin_launch_agent_path: "{{ ansible_env.HOME }}/Library/LaunchAgents/{{ jellyfin_launch_agent_label }}.plist"
jellyfin_port: 8096
# Expose Jellyfin on the internet at https://<machine>.<tailnet>.ts.net via Tailscale Funnel
jellyfin_tailscale_funnel: false
tailscale_cli: /Applications/Tailscale.app/Contents/MacOS/Tailscale

# *arr stack (Seerr, Sonarr, Radarr, Prowlarr, qBittorrent behind a VPN) run with
# Docker Compose in OrbStack. Only the media server should enable this, via
# config.yml, along with arr_media_dir and arr_wireguard_private_key
configure_arr: false
# Drive root holding Movies/ and TV Shows/. Downloads go to <arr_media_dir>/downloads,
# on the same drive so finished downloads are hardlinked into the libraries, not copied
arr_media_dir: ''
arr_compose_dir: "{{ ansible_env.HOME }}/.arr-stack"
arr_timezone: America/New_York
# From a Proton VPN WireGuard config generated with NAT-PMP (port forwarding) on
arr_wireguard_private_key: ''
# Comma-separated Proton server countries (e.g. "United States,Canada"); empty = anywhere.
# Nearby servers are much faster
arr_vpn_server_countries: ''
# Cap on the RAM OrbStack's VM can use
arr_orbstack_memory_mib: 3072
arr_seerr_port: 5055
# Expose Seerr on the internet at https://<machine>.<tailnet>.ts.net:8443 via Tailscale
# Funnel (it only allows ports 443, 8443 and 10000, and 443 is Jellyfin's)
arr_seerr_tailscale_funnel: false
arr_seerr_funnel_port: 8443
orbstack_bin: /Applications/OrbStack.app/Contents/MacOS/xbin
# Nightly backups of the apps' settings and databases, which otherwise only exist in
# OrbStack's VM (excluded from backups)
arr_backup_dir: "{{ arr_media_dir }}/arr-backups"
arr_backup_apps: [sonarr, radarr, sonarr-4k, radarr-4k, prowlarr, seerr, qbittorrent, recyclarr]
arr_backup_keep_days: 14
arr_backup_hour: 4
arr_backup_launch_agent_label: com.santiagohervella.arr-backup
arr_backup_launch_agent_path: "{{ ansible_env.HOME }}/Library/LaunchAgents/{{ arr_backup_launch_agent_label }}.plist"

osx_script: './.macos.sh --no-restart'
osx_personal_script: './.macos-personal-only.sh --no-restart'
osx_work_script: './.macos-work-only.sh --no-restart'

# Install packages from other package managers.
# Note: You are responsible for making sure the required package managers are
# installed, eg. through homebrew.
gem_packages: []
# - name: bundler
#   state: present # present/absent/latest, default: present
#   version: "~> 1.15.1" # default: N/A
npm_packages:
  - typescript # Need this because it installs tsserver, which is used by the typescript LSP
#   state: present # present/absent/latest, default: present
#   version: "^2.6" # default: N/A
pip_packages: []
# - name: mkdocs
#   state: present # present/absent/latest, default: present
#   version: "0.16.3" # default: N/A
go_packages:
  - name: github.com/golang-migrate/migrate/v4/cmd/migrate #Needed for db migrations in various personal projects
    version: latest
    tags: sqlite3

# Glob pattern to ansible task files to run after all other tasks are finished.
post_provision_tasks: []
